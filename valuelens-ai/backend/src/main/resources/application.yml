server:
  port: 8080

spring:
  application:
    name: valuelens-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/valuelens_db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true

nvidia:
  base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
  api-key: ${NVIDIA_API_KEY}
  model: ${NVIDIA_MODEL:meta/llama-3.2-11b-vision-instruct}
  temperature: ${NVIDIA_TEMPERATURE:0.6}
  max-tokens: ${NVIDIA_MAX_TOKENS:1500}
  timeout-seconds: ${NVIDIA_TIMEOUT_SECONDS:35}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  calculation:
    engine-version: ROI_ENGINE_V1
    default-currency: USD
  pricing:
    version-tag: BTP_2026_Q1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.valuelens.ai: INFO
    org.springframework.web: INFO
