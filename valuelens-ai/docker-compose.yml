version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: valuelens-postgres
    environment:
      POSTGRES_DB: valuelens_db
      POSTGRES_USER: valuelens_user
      POSTGRES_PASSWORD: valuelens_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valuelens_user -d valuelens_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: valuelens-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/valuelens_db
      SPRING_DATASOURCE_USERNAME: valuelens_user
      SPRING_DATASOURCE_PASSWORD: valuelens_password
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
      NVIDIA_MODEL: meta/llama-3.2-11b-vision-instruct
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: valuelens-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
